<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Victor Antoniazi Gonzalez — Software Engineering</title>
  <desc id="desc">Dark blue professional banner with a connected systems illustration.</desc>
